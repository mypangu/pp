<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Player</title>

<style>
:root {
  --bg-start: #0a0e1a;
  --bg-end: #1a1f35;
  --card-bg: rgba(255, 255, 255, 0.06);
  --card-border: rgba(255, 255, 255, 0.1);
  --text-primary: #ffffff;
  --text-secondary: #b8c1ec;
  --accent-ns: linear-gradient(135deg, #ff512f, #dd2476);
  --accent-playify: linear-gradient(135deg, #4facfe, #00f2fe);
  --accent-ruby: linear-gradient(135deg, #f7971e, #ffd200);
  --accent-copy: linear-gradient(135deg, #43e97b, #38f9d7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 480px;
  animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 32px 24px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
}

.header {
  text-align: center;
  margin-bottom: 32px;
}

.icon {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  font-size: 32px;
}

.channel-name {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stream-info {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.info-tag {
  background: rgba(255, 255, 255, 0.1);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}

.quality-tag {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
}

.divider {
  height: 1px;
  background: var(--card-border);
  margin: 28px 0;
}

.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 16px;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.player-btn {
  padding: 16px;
  border: none;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 600;
  color: white;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
  overflow: hidden;
}

.player-btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

.player-btn:active::before {
  width: 300px;
  height: 300px;
}

.player-btn:active {
  transform: scale(0.96);
}

.btn-ns {
  background: var(--accent-ns);
}

.btn-playify {
  background: var(--accent-playify);
}

.btn-ruby {
  background: var(--accent-ruby);
  color: #1a1f35;
}

.btn-copy {
  background: var(--accent-copy);
  color: #1a1f35;
}

.btn-icon {
  font-size: 20px;
}

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(0, 0, 0, 0.9);
  color: white;
  padding: 14px 24px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  z-index: 1000;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.error-message {
  text-align: center;
  padding: 40px 20px;
}

.error-icon {
  font-size: 48px;
  margin-bottom: 16px;
}

.error-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 8px;
}

.error-text {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
}

@media (max-width: 360px) {
  .card {
    padding: 24px 16px;
  }
  
  .channel-name {
    font-size: 24px;
  }
  
  .player-btn {
    padding: 14px;
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="card" id="streamCard">
    <!-- Content will be dynamically loaded -->
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Parse URL parameters
function getUrlParams() {
  const queryString = window.location.search;
  
  // Extract individual parameters manually to preserve the full URL
  const getParam = (name) => {
    const regex = new RegExp('[?&]' + name + '=([^&]*)', 'i');
    const match = queryString.match(regex);
    return match ? decodeURIComponent(match[1]) : null;
  };
  
  // For the URL parameter, we need to get everything after 'url=' to the end
  // This is because the stream URL itself contains & characters
  let fullUrl = null;
  const urlIndex = queryString.indexOf('url=');
  if (urlIndex !== -1) {
    // Get everything after 'url=' - this is the complete stream URL
    fullUrl = queryString.substring(urlIndex + 4);
    // Don't decode it - keep %7C as is
  }
  
  return {
    channel: getParam('channel'),
    language: getParam('language'),
    quality: getParam('quality') || 'HD',
    format: getParam('format') || 'DASH',
    url: fullUrl
  };
}

// Show toast notification
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2800);
}

// Generate player buttons HTML
function generatePlayerButtons(streamUrl) {
  return `
    <div class="divider"></div>
    <div class="section-title">Choose Player</div>
    <div class="buttons">
      <button class="player-btn btn-ns" onclick="openNSPlayer('${streamUrl}')">
        <span class="btn-icon">▶</span>
        <span>NS Player</span>
      </button>
      
      <button class="player-btn btn-playify" onclick="openPlayify('${streamUrl}')">
        <span class="btn-icon">▶</span>
        <span>PlayiFy</span>
      </button>
      
      <button class="player-btn btn-ruby" onclick="openRubyPlayer('${streamUrl}')">
        <span class="btn-icon">▶</span>
        <span>Ruby Player</span>
      </button>
      
      <button class="player-btn btn-copy" onclick="copyUrl('${streamUrl}')">
        <span class="btn-icon">📋</span>
        <span>Copy Stream URL</span>
      </button>
    </div>
  `;
}

// Player functions
function openNSPlayer(url) {
  window.location.href = 
    "intent:" + url +
    "#Intent;action=android.intent.action.VIEW;" +
    "type=video/*;" +
    "package=com.genuine.leone;" +
    "end";
}

function openPlayify(url) {
  window.location.href = 
    "intent:" + url +
    "#Intent;action=android.intent.action.VIEW;" +
    "type=video/*;" +
    "package=com.appnix.playify;" +
    "end";
}

function openRubyPlayer(url) {
  const rubyUrl = "https://rubyplayer.pages.dev/play?data=" + encodeURIComponent(url);
  window.location.href = rubyUrl;
}

function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => {
    showToast('✓ Stream URL copied to clipboard');
  }).catch(() => {
    showToast('⚠ Failed to copy URL');
  });
}

// Initialize page
function initializePage() {
  const params = getUrlParams();
  const card = document.getElementById('streamCard');
  
  // Validate required parameters
  if (!params.channel || !params.url) {
    card.innerHTML = `
      <div class="error-message">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Invalid Link</div>
        <div class="error-text">
          This link is missing required parameters (channel and url).<br><br>
          Please use a valid stream link.
        </div>
      </div>
    `;
    return;
  }
  
  // Build the stream info page
  card.innerHTML = `
    <div class="header">
      <div class="icon">📡</div>
      <div class="channel-name">${params.channel}</div>
      <div class="stream-info">
        ${params.language ? `<span class="info-tag">🌐 ${params.language}</span>` : ''}
        <span class="info-tag quality-tag">⚡ ${params.quality}</span>
        <span class="info-tag">📊 ${params.format}</span>
      </div>
    </div>
    ${generatePlayerButtons(params.url)}
  `;
}

// Run on page load
initializePage();
</script>

</body>
</html>
